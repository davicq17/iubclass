<h2 class="text-2xl font-bold text-slate-900">Puesto de {{ vendedor() }}</h2>
<p class="mt-1 text-sm text-slate-500">Inventario . {{ hoy | date: 'fullDate' }}</p>

<div class="mt-4 overflow-x-auto rounded-xl border border-slate-200">
  <app-resumen-pedido [linea]="pedido()" />
</div>

<div class="flex flex-wrap gap-3">
      @for (p of productos(); track p.nombre;) {
        <app-tarjeta-producto [producto]="p" (agregar)="resumenPedido($event)" />
      }
</div>
    <div class="mt-3 flex gap-2">
      <button type="button" class="btn" >Subir el ñame 1.000</button>
      <button type="button" class="btn" >Restaurar precios</button>
    </div>
